<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чанки: прототип</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff}#hud{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.5);padding:8px;border-radius:6px;font-size:13px;white-space:pre;pointer-events:none}#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#fff;border-radius:50%;pointer-events:none}canvas{display:block;touch-action:none}html,body{touch-action:none}</style></head>
<body><div id="hud"></div><div id="cross"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Disaster Survival: ядро мира, шаг 1a.
   Генерация по сиду (не зависит от порядка создания блоков), чанки 16x16,
   в памяти и в сохранении держатся только изменения игрока.
   Пока не подключено к игре: шаг 1b подключит рисование чанков. */

const CS = 16;   // размер чанка в блоках
const RI = 70;   // радиус острова в блоках (диаметр около 140, примерно 9 чанков)
const WC = {};   // настройки мира, заполняются в initWorld

// Строка -> число (FNV-1a). Один и тот же сид всегда даёт один и тот же мир
function strHash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Детерминированное число 0..1 для точки мира. Не зависит от того, в каком порядке идёт генерация
function rnd3(x, y, z, salt) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177) ^ Math.imul(WC.seed ^ salt, 2246822507);
  h = Math.imul(h ^ (h >>> 15), 2654435761);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Водоёмы в шаге 1a: положения от сида. Размеры поменяем на 2x2 и 5x5 чанков в шаге 2
function initWorld(seedStr) {
  WC.seed = strHash(seedStr);
  const a = rnd3(1, 0, 1, 11) * Math.PI / 2, b = -Math.PI / 2 + rnd3(2, 0, 2, 12) * Math.PI / 2, c = rnd3(3, 0, 3, 13) * Math.PI * 2;
  WC.sea = { x: Math.cos(a) * 52, z: Math.sin(a) * 52, h: 22 };
  WC.lake = { x: Math.cos(b) * 30, z: Math.sin(b) * 30, h: 8.8 };
  WC.river = [];
  for (let t = 0; t <= 1; t += .02) {
    const d = RI * (1 - t) + 8 * t;
    WC.river.push([Math.cos(c) * d + Math.sin(t * 9) * 2, Math.sin(c) * d]);
  }
  COL.clear(); MODS.clear(); CHUNKS.clear();
}

// Есть ли вода в колонке (x,z): океан, озеро или речка
function waterAt(x, z) {
  const s = WC.sea, l = WC.lake;
  if (x >= HOUSE.x0 - 4 && x <= HOUSE.x0 + 10 && z >= HOUSE.z0 - 4 && z <= HOUSE.z0 + 10) return false;
  const inBox = (w, x0, z0) => Math.abs(x0 - w.x) <= w.h && Math.abs(z0 - w.z) <= w.h;
  if (inBox(s, x, z) || inBox(l, x, z)) return true;
  const R = WC.river;
  for (let i = 0; i < R.length - 1; i++) {
    const ax = R[i][0], az = R[i][1], dx = R[i + 1][0] - ax, dz = R[i + 1][1] - az;
    const L = dx * dx + dz * dz || 1;
    let t = ((x - ax) * dx + (z - az) * dz) / L; t = t < 0 ? 0 : t > 1 ? 1 : t;
    if (Math.hypot(x - (ax + dx * t), z - (az + dz * t)) <= 1.5) return true;
  }
  return false;
}

// Колонка (x,z): глубина острова и вода. Кэшируется, чтобы не считать речку для каждого блока
const COL = new Map();
function colInfo(x, z) {
  const k = x + ',' + z;
  let c = COL.get(k);
  if (!c) {
    const d = Math.hypot(x, z);
    c = d > RI ? null : { dp: Math.max(2, Math.round(100 * Math.pow(1 - d / RI, .6))), w: waterAt(x, z) };
    COL.set(k, c);
  }
  return c;
}

// Тип блока, который создаёт генерация (без изменений игрока). '' = воздух
const HOUSE = { x0: -9, z0: -9 };
const TREE_CHANCE = .01, ROCK_CHANCE = .015, TOK = new Map(), REGROW = [];
const TK = (rx, rz) => rx * 131071 + rz;
function nearWater(x, z) {
  for (let a = -16; a <= 16; a++) for (let b = -16; b <= 16; b++) if (waterAt(x + a, z + b)) return true;
  return false;
}
// Корень дерева в (rx,rz): решается по сиду, не зависит от того, какой чанк загружен первым
function treeRoot(rx, rz) {
  const k = TK(rx, rz);
  if (TOK.has(k)) return TOK.get(k);
  let ok = rnd3(rx, 0, rz, 21) < TREE_CHANCE;
  const c = ok ? colInfo(rx, rz) : null;
  ok = !!c && !c.w && !(rx >= HOUSE.x0 - 3 && rx <= HOUSE.x0 + 9 && rz >= HOUSE.z0 - 3 && rz <= HOUSE.z0 + 9) && !(Math.abs(rx) < 3 && Math.abs(rz) < 3) && !nearWater(rx, rz);
  TOK.set(k, ok);
  return ok;
}
function treeAt(x, y, z) {
  if (y < 1 || y > 6) return '';
  for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) {
    if (!treeRoot(x - a, z - b)) continue;
    if (a === 0 && b === 0 && y <= 4) return 'log';
    if (y === 6 && a === 0 && b === 0) return 'leaves';
    if ((y === 4 || y === 5) && Math.abs(a) <= 1 && Math.abs(b) <= 1) return 'leaves';
  }
  return '';
}
const ROCK_ROOT_CHANCE = .0009, RTOK = new Map();
function nearWaterR(x, z, r) { for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) if (waterAt(x + a, z + b)) return true; return false; }
function rockRoot(rx, rz) {
  const k = TK(rx, rz);
  if (RTOK.has(k)) return RTOK.get(k);
  let ok = rnd3(rx, 1, rz, 31) < ROCK_ROOT_CHANCE;
  const c = ok ? colInfo(rx, rz) : null;
  ok = !!c && !c.w && !(Math.abs(rx) < 3 && Math.abs(rz) < 3) && !nearWaterR(rx, rz, 3);
  RTOK.set(k, ok);
  return ok;
}
function rockAt(x, y, z) {
  if (y !== 1) return '';
  const c = colInfo(x, z);
  if (!c || c.w) return '';
  let near = false;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if (rockRoot(x - a, z - b)) near = true;
  if (!near || (rnd3(x, 1, z, 35) >= .5 && !rockRoot(x, z))) return '';
  return rockRoot(x, z) && rnd3(x, 1, z, 33) < .3 ? 'kremen' : 'stone';
}
// Дом 7x7: белый камень внизу, брёвна по углам, доски наверху. Дверь на юг, окон нет
function houseAt(x, y, z) {
  const i = x - HOUSE.x0, j = z - HOUSE.z0;
  if (i < 0 || j < 0 || i > 6 || j > 6 || y < 0 || y > 6) return '';
  if (i === 1 && j === 1 && y >= 1 && y <= 5) return 'ladder';
  const e = i === 0 || i === 6 || j === 0 || j === 6, cr = (i === 0 || i === 6) && (j === 0 || j === 6);
  if (y === 0) return e ? '' : 'white';
  if (y <= 2) return (!e || (i === 3 && j === 0)) ? '' : (cr ? 'log' : 'white');
  if (y === 3) return e ? 'log' : 'planks';
  if (y <= 5) return e ? (cr ? 'log' : 'planks') : '';
  return 'planks';
}
function structAt(x, y, z) {
  const i = x - HOUSE.x0, j = z - HOUSE.z0;
  if (i >= 0 && j >= 0 && i <= 6 && j <= 6) return houseAt(x, y, z);
  return treeAt(x, y, z) || rockAt(x, y, z);
}
// Срубили последнее бревно дерева: листва пропадает сразу, дерево начинает расти заново
function treeCut(x, z) {
  if (!treeRoot(x, z)) return;
  for (let y = 1; y <= 4; y++) if (getB(x, y, z) === 'log') return;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let y = 4; y <= 6; y++)
    if (getB(x + a, y, z + b) === 'leaves') { setB(x + a, y, z + b, ''); markDirty(x + a, z + b); }
  REGROW.push({ x, z, s: 0, t: 0 });
}
// Рост: каждые 60 секунд +1 бревно, на четвёртой стадии появляется листва
function treeTick(dt) {
  for (let i = REGROW.length - 1; i >= 0; i--) {
    const g = REGROW[i];
    if ((g.t += dt) < 60) continue;
    g.t = 0; g.s++;
    if (!getB(g.x, g.s, g.z)) { setB(g.x, g.s, g.z, 'log'); markDirty(g.x, g.z); }
    if (g.s === 4) {
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let y = 4; y <= 5; y++)
        if (!getB(g.x + a, y, g.z + b)) setB(g.x + a, y, g.z + b, 'leaves');
      if (!getB(g.x, 6, g.z)) setB(g.x, 6, g.z, 'leaves');
      REGROW.splice(i, 1);
    }
  }
}
// Руды по слоям Y: алмаз -6..-9, серебро -10..-19, золото -20..-34, титан -35..-99, такурит -50..-99 (шанс 2% на блок в слое)
function oreAt(x, y, z) {
  if (y <= -6 && y >= -9 && rnd3(x, y, z, 41) < .02) return 'diamond';
  if (y <= -10 && y >= -19 && rnd3(x, y, z, 42) < .02) return 'silver';
  if (y <= -20 && y >= -34 && rnd3(x, y, z, 43) < .02) return 'gold';
  if (y <= -35 && y >= -99) {
    if (y <= -50 && rnd3(x, y, z, 44) < .008) return 'takurit';
    if (rnd3(x, y, z, 45) < .015) return 'titan';
  }
  return '';
}
/* Заброшенная свалка: 10% чанков, в каждом три мусорных бака на поверхности (Y1) */
const SCRAP = new Map();
function scrapBins(cx, cz) {
  const key = cx + ',' + cz;
  if (SCRAP.has(key)) return SCRAP.get(key);
  let list = null;
  if (rnd3(cx, 999, cz, 91) < .1) {
    const ox = cx * CS + 3 + Math.floor(rnd3(cx, 998, cz, 92) * 9), oz = cz * CS + 3 + Math.floor(rnd3(cx, 997, cz, 93) * 9);
    list = [[ox, oz], [ox + 2, oz + 1], [ox + 1, oz + 3]];
    if (list.some(([x, z]) => !colInfo(x, z) || colInfo(x, z).w)) list = null;
  }
  SCRAP.set(key, list);
  return list;
}
function isScrapBin(x, y, z) {
  if (y !== 1) return false;
  const list = scrapBins(Math.floor(x / CS), Math.floor(z / CS));
  return !!list && list.some(([a, b]) => a === x && b === z);
}
function blockAt(x, y, z) {
  const sct = structAt(x, y, z);
  if (sct) return sct;
  if (y === 1 && isScrapBin(x, y, z)) return 'bin';
  const c = colInfo(x, z);
  if (!c || y > 0 || y < -c.dp) return '';
  if (y === 0) return c.w ? 'water' : 'grass';
  if (y === -1 && c.w) return 'water';
  if (y >= -3) return 'dirt';
  if (y === -100) return 'bedrock';
  if (y <= -4) {
    if (y >= -5 || (y <= -10 && rnd3(x, y, z, 46) < .5)) return 'white';
    const o = oreAt(x, y, z); if (o) return o;
    return rnd3(x, y, z, 7) < .1 ? 'kremen' : 'stone';
  }
  return rnd3(x, y, z, 7) < .1 ? 'kremen' : 'stone';
}

// Только изменения игрока: 'x,y,z' -> тип ('' = блок удалён)
const MODS = new Map();
function getB(x, y, z) {
  const k = x + ',' + y + ',' + z;
  return MODS.has(k) ? MODS.get(k) : blockAt(x, y, z);
}
function setB(x, y, z, t) { MODS.set(x + ',' + y + ',' + z, t || ''); if (window.mpSendBlock) window.mpSendBlock(x + ',' + y + ',' + z, t || ''); }

// Прогруженные чанки: 'cx,cz'. Вокруг игрока квадрат радиусом dist чанков
const CHUNKS = new Set();
function chunkOf(x, z) { return [Math.floor(x / CS), Math.floor(z / CS)]; }
function updateChunks(px, pz, dist) {
  const [cx, cz] = chunkOf(px, pz);
  const want = new Set(), added = [], removed = [];
  for (let i = -dist; i <= dist; i++)
    for (let j = -dist; j <= dist; j++) {
      const k = (cx + i) + ',' + (cz + j);
      want.add(k);
      if (!CHUNKS.has(k)) { CHUNKS.add(k); added.push([cx + i, cz + j]); }
    }
  for (const k of [...CHUNKS]) if (!want.has(k)) { CHUNKS.delete(k); removed.push(k); }
  return { added, removed };
}

// Сохранение: только изменения, поэтому файлы маленькие
const saveMods = () => [...MODS];
const loadMods = arr => { MODS.clear(); for (const [k, t] of arr) MODS.set(k, t); };
/* Шаг 1b: прототип рисования чанков поверх world-core.js */
const TCOL = { grass: 0x4f8a33, dirt: 0x7a5230, stone: 0x7f7f86, white: 0xe9e9e1, kremen: 0x111111, planks: 0xc08c4c, log: 0x6b4424, leaves: 0x2e7a2e, furnace: 0x8a8a8a, cauldron: 0x4a4a50, water: 0x3a8fd6 };
const PL = ['dirt', 'stone', 'planks', 'white'];
let SEL = 'stone';
const FACE_DEFS = [[0, 1], [0, -1], [1, 1], [1, -1], [2, 1], [2, -1]];
const QC = [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]], QI = [0, 1, 2, 0, 2, 3];
const MESH = new Map(), DIRTY = new Set();
let DIST = 3;
const P = { x: 0, y: 3, z: 0 };
let vy = 0, gr = 0, yaw = 0, pit = 0;
const KY = {};

const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio * 1.5, matchMedia('(pointer:coarse)').matches ? 2 : 2.5));
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap; ren.outputEncoding = THREE.sRGBEncoding; ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;
ren.setSize(innerWidth, innerHeight);
document.body.insertBefore(ren.domElement, document.body.firstChild);
const sc = new THREE.Scene();
sc.background = new THREE.Color(0x87b8e8);
sc.fog = new THREE.Fog(0x87b8e8, 30, 75);
const cam = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, .05, 300);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });

// Физика: та же логика, что в основной игре, но мир берётся из getB
const solid = (x, y, z) => { const t = getB(x, y, z); return !!t && t !== 'water' && t !== 'ladder' && t !== 'doora'; };
function col(x, y, z) {
  for (let i = Math.round(x - .3); i <= Math.round(x + .29); i++)
    for (let j = Math.round(y); j <= Math.round(y + 1.79); j++)
      for (let k = Math.round(z - .3); k <= Math.round(z + .29); k++)
        if (solid(i, j, k)) return true;
  return false;
}
function step(dt) {
  const fw = Math.max(-1, Math.min(1, (KY.KeyW ? 1 : 0) - (KY.KeyS ? 1 : 0) + JZ)), st = Math.max(-1, Math.min(1, (KY.KeyD ? 1 : 0) - (KY.KeyA ? 1 : 0) + JX));
  let dx = fw * -Math.sin(yaw) + st * Math.cos(yaw), dz = fw * -Math.cos(yaw) - st * Math.sin(yaw);
  const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;
  const sp = ((KY.ShiftLeft || RUN) && FD >= 30 && WT > 0) ? 6.5 : 4.3, moving = fw || st ? 1 : 0;
  const ax = P.x + dx * sp * dt * moving, az = P.z + dz * sp * dt * moving;
  if (!col(ax, P.y, P.z)) P.x = ax;
  if (!col(P.x, P.y, az)) P.z = az;
  if (KY.Space && gr) vy = 8.5;
  if (onLadder()) vy = ((fw > .3 || KY.Space) ? 3.2 : 0) - (fw < -.3 ? 3.2 : 0); else vy -= 26 * dt;
  if (!col(P.x, P.y + vy * dt, P.z)) { P.y += vy * dt; gr = 0; } else { if (vy < 0) gr = 1; vy = 0; }
}

// Луч от камеры: первый твёрдый блок и последний воздух перед ним
function ray() {
  const o = cam.position, d = new THREE.Vector3(); cam.getWorldDirection(d);
  let pv = null;
  for (let t = 0; t < 6; t += .05) {
    const x = Math.round(o.x + d.x * t), y = Math.round(o.y + d.y * t), z = Math.round(o.z + d.z * t);
    if (pv && pv[0] === x && pv[1] === y && pv[2] === z) continue;
    if (solid(x, y, z)) return { hit: [x, y, z], pl: pv };
    pv = [x, y, z];
  }
  return null;
}
function markDirty(x, z) {
  const [cx, cz] = chunkOf(x, z);
  for (const [a, b] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) DIRTY.add((cx + a) + ',' + (cz + b));
}
const HOT = new Array(36).fill(null);
HOT[0] = { id: 'pick', n: 1 }; HOT[1] = { id: 'axe', n: 1 };
let SLOT = 0, MSG = '', MT = 0;
const ITEM_NAME = { pick: 'Кирка', axe: 'Кремневый топор', dirt: 'Земля', stone: 'Камень', white: 'Белый камень', kremen: 'Кремень', planks: 'Доски', log: 'Бревно', pork: 'Сырая свинина', chicken: 'Сырая курятина', steak: 'Сырой стейк', stick: 'Палка', furnace: 'Печка', cpork: 'Жареная свинина', cchicken: 'Жареная курятина', csteak: 'Стейк', cauldron: 'Котел', cauldronW: 'Котел с водой', gold: 'Золото', diamond: 'Алмаз', silver: 'Серебро', titan: 'Титан', takurit: 'Такурит' };
const PLACEABLE = ['dirt', 'stone', 'white', 'planks', 'log'];
const BLOCK_INFO = { grass: { need: '', drop: 'dirt' }, dirt: { need: '', drop: 'dirt' }, stone: { need: 'pick', drop: 'stone' }, white: { need: 'pick', drop: 'white' }, kremen: { need: 'pick', drop: 'kremen' }, planks: { need: 'axe', drop: 'planks' }, log: { need: 'axe', drop: 'log' }, leaves: { need: '', drop: 'stick' }, furnace: { need: 'pick', drop: 'furnace' }, cauldron: { need: 'pick', drop: 'cauldron' }, gold: { need: 'pick', drop: 'gold' }, diamond: { need: 'pick', drop: 'diamond' }, silver: { need: 'pick', drop: 'silver' }, titan: { need: 'pick', drop: 'titan' }, takurit: { need: 'pick', drop: 'takurit' }, ladder: { need: '', drop: 'ladder' }, bin: { need: '', drop: 'bin' } };
const TOOL_IDS = ['pick', 'axe', 'dpick', 'spick', 'gpick', 'tpick', 'kpick', 'car', 'bin'];
// Кирки: крафт 2 палки + 3 материала; ускорение ломания камня, белого камня и руд
const PICK_MAT = { dpick: 'diamond', spick: 'silver', gpick: 'gold', tpick: 'titan', kpick: 'takurit' };
const PICK_BONUS = { pick: 0, dpick: .2, spick: .35, gpick: .45, tpick: .6, kpick: .85 };
const PICK_HEADN = { pick: 0x9a9a9a, dpick: 0x7ef0ff, spick: 0xd8dde4, gpick: 0xf0c040, tpick: 0xc8d0d8, kpick: 0xb07aff };
const STONEISH = ['stone', 'white', 'kremen', 'diamond', 'silver', 'gold', 'titan', 'takurit'];
Object.assign(ITEM_NAME, { dpick: 'Алмазная кирка', spick: 'Серебряная кирка', gpick: 'Золотая кирка', tpick: 'Титановая кирка', kpick: 'Такуритовая кирка' });
Object.assign(ITEM_NAME, { ladder: 'Лестница', metal: 'Металл', car: 'Машина NVM-3000', bin: 'Мусорный бак' });
let PKH = '';
function isPick(id) { return PICK_BONUS[id] !== undefined; }
function needOk(need) { const hd = held(); return need === 'pick' ? isPick(hd) : hd === need; }
function pkCount(id) { return HOT.reduce((a, s) => a + (s && s.id === id ? s.n : 0), 0); }
function pkSpend(id, n) { for (let i = 0; i < HOT.length && n > 0; i++) { const s = HOT[i]; if (s && s.id === id) { const a = Math.min(s.n, n); s.n -= a; n -= a; if (s.n <= 0) HOT[i] = null; } } }
function craftPick(id) {
  const mat = PICK_MAT[id];
  if (pkCount('stick') < 2 || pkCount(mat) < 3) return msg('Для ' + ITEM_NAME[id] + ' нужно 2 палки и 3 ' + ITEM_NAME[mat]);
  if (HOT.every(s => s)) return msg('Нет места для кирки');
  pkSpend('stick', 2); pkSpend(mat, 3); giveItem(id);
  msg('Крафт: ' + ITEM_NAME[id]);
}
function msg(t) { MSG = t; MT = 2.5; }
function held() { return HOT[SLOT] ? HOT[SLOT].id : ''; }

BARF.style.cssText = 'position:fixed;left:50%;top:calc(50% + 16px);width:70px;height:6px;margin-left:-35px;background:rgba(0,0,0,.5);opacity:0;pointer-events:none';
BARF.innerHTML = '<i style="display:block;height:100%;width:0;background:#ffd54a"></i>';
document.body.appendChild(BARF);
const XYZEL = document.createElement('div');
XYZEL.style.cssText = 'position:fixed;left:12px;top:12px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;font-size:13px;pointer-events:none;display:none';
document.body.appendChild(XYZEL);
// Время ломания: 1 единица прочности = 1 секунда
const BLOCK_HARD = { grass: .5, dirt: .5, stone: 3, white: 4, kremen: 5, planks: 1, log: 1, leaves: .2, furnace: 3, cauldron: 3, gold: 15, diamond: 6, silver: 16, titan: 25, takurit: 50, ladder: .3, bin: 10 };
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse' && e.target && e.target.closest && e.target.closest('button.tb')) BRK = false; });
addEventListener('mouseup', () => { BRK = false; });
function updBreak(dt) {
  const on = !!CUR;
  const cc = colInfo(P.x, P.z);
  if (on && P.y < (cc ? -cc.dp - 6 : -6)) { P.x = 0; P.y = 3; P.z = 0; vy = 0; msg('Ты упал за карту, телепорт в центр'); }
  XYZEL.style.display = on ? '' : 'none';
  if (on) XYZEL.textContent = 'X ' + Math.round(P.x) + '   Y ' + Math.round(P.y - .5) + '   Z ' + Math.round(P.z);
  const r = BRK && on ? ray() : null;
  const info = r && r.hit ? BLOCK_INFO[getB(r.hit[0], r.hit[1], r.hit[2])] : null;
  if (!info || (info.need && !needOk(info.need))) { BT.t = 0; BT.k = ''; BARF.style.opacity = 0; return; }
  const bt0 = getB(r.hit[0], r.hit[1], r.hit[2]), key = r.hit.join(','), need = (BLOCK_HARD[bt0] || 1) / (1 + (STONEISH.includes(bt0) ? (PICK_BONUS[held()] || 0) : 0));
  if (BT.k !== key) { BT.k = key; BT.t = 0; }
  BT.t += dt;
  BARF.style.opacity = 1; BARF.firstElementChild.style.width = Math.min(100, BT.t / need * 100) + '%';
  if (BT.t >= need) { BT.t = 0; BT.k = ''; doBreak(); }
}
/* Чат мультиплеера: T или кнопка 💬 — открыть, Enter — отправить, Esc — закрыть */
const CHATL = document.createElement('div');
CHATL.style.cssText = 'position:fixed;right:12px;top:62px;width:42vw;max-width:340px;text-align:right;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;display:none;z-index:20';
document.body.appendChild(CHATL);
const CHATI = document.createElement('input');
CHATI.maxLength = 200; CHATI.placeholder = 'Сообщение (Enter)';
CHATI.style.cssText = 'position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(88vw,380px);font-size:16px;padding:8px;display:none;z-index:46';
document.body.appendChild(CHATI);
const CHATB = document.createElement('button');
CHATB.textContent = '💬';
CHATB.style.cssText = 'position:fixed;right:162px;top:8px;width:44px;height:44px;display:none;z-index:20;font-size:20px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #444';
CHATB.onpointerdown = e => { e.preventDefault(); openChat(); };
document.body.appendChild(CHATB);
function addChat(name, text) {
  const d = document.createElement('div'), b = document.createElement('b');
  b.textContent = name + ': '; d.appendChild(b); d.appendChild(document.createTextNode(text));
  CHATL.appendChild(d);
  while (CHATL.children.length > 8) CHATL.removeChild(CHATL.firstChild);
}
function openChat() { if (!MP.ws || PAUSED) return; CHATI.style.display = ''; CHATI.value = ''; CHATI.focus(); if (document.pointerLockElement) document.exitPointerLock(); }
function closeChat() { CHATI.style.display = 'none'; CHATI.blur(); }
function sendChat() { const t = CHATI.value.trim(); if (t && MP.ws && MP.ws.readyState === 1) MP.ws.send(JSON.stringify({ t: 'chat', text: t })); closeChat(); }
CHATI.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') sendChat(); else if (e.key === 'Escape') closeChat(); });
addEventListener('keydown', e => { if (e.code === 'KeyT' && MP.ws && CHATI.style.display === 'none') { e.preventDefault(); openChat(); } });
/* Запрет выделения текста и системного меню при долгом касании: мешало водить машину на телефоне */
/* Окна с текстом ошибок: чтобы было видно, на чём ломается вход в мультиплеер (не больше трёх) */
let ERRS = 0;
addEventListener('error', e => { if (ERRS++ < 3) alert('Ошибка в игре: ' + e.message + (e.lineno ? ' (строка ' + e.lineno + ')' : '')); });
addEventListener('unhandledrejection', e => { if (ERRS++ < 3) alert('Ошибка: ' + ((e.reason && e.reason.message) || e.reason)); });
const NOSEL = document.createElement('style');
NOSEL.textContent = 'body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } input, textarea { -webkit-user-select: text; user-select: text; } canvas, button { touch-action: none; }';
document.head.appendChild(NOSEL);
document.addEventListener('selectstart', e => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
bootGame();
requestAnimationFrame(frame);
</script></body></html>
